[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reth-basis-daemon"
version = "0.1.0"
description = "Passive research daemon for Rocket Pool rETH/ETH basis analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "web3>=7.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "greenlet>=3.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
reth-basis = "src.main:cli"
reth-dashboard = "src.dashboard.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
