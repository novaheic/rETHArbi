services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reth
      POSTGRES_PASSWORD: reth
      POSTGRES_DB: reth_basis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reth -d reth_basis"]
      interval: 5s
      timeout: 5s
      retries: 10

  daemon:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://reth:reth@db:5432/reth_basis
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

volumes:
  pgdata:
